name: Deploy API to Azure VM

permissions:
  contents: read

concurrency:
  group: production-api-deploy
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.HOST_IP }} >> ~/.ssh/known_hosts

    - name: Pull code
      run: |
        ssh -i ~/.ssh/id_rsa azureuser@${{ secrets.HOST_IP }} 'set -e
        cd /var/www/Pet-Sitter-Management-System-API
        git fetch origin
        git reset --hard origin/master || git reset --hard origin/main'

    - name: Write .env file
      run: |
        ssh -i ~/.ssh/id_rsa azureuser@${{ secrets.HOST_IP }} 'cat > /var/www/Pet-Sitter-Management-System-API/.env' << 'ENVEOF'
        NODE_ENV=production
        PORT=8000
        MONGODB_URI=${{ secrets.MONGODB_URI }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        JWT_EXPIRES_IN=24h
        CLOUDINARY_CLOUD_NAME=dnutx6czj
        CLOUDINARY_API_KEY=362787522778931
        CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
        AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        AZURE_STORAGE_CONTAINER_NAME=pet-images
        MAIL_HOST=mail.spacemail.com
        MAIL_PORT=465
        SMTP_SECURE=true
        MAIL_USER=admin@whiskarz.com
        MAIL_PASS=${{ secrets.MAIL_PASS }}
        MAIL_FROM=admin@whiskarz.com
        ADMIN_EMAIL=admin@whiskarz.com
        FRONTEND_URL=https://app.whiskarz.com/
        ENVEOF

    - name: Deploy containers
      run: |
        ssh -i ~/.ssh/id_rsa azureuser@${{ secrets.HOST_IP }} 'set -e
        cd /var/www/Pet-Sitter-Management-System-API
        printf "services:\n  api:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    ports:\n      - 8000:8000\n    env_file:\n      - .env\n    restart: unless-stopped\n    logging:\n      driver: json-file\n      options:\n        max-size: 10m\n        max-file: \"3\"\n" > docker-compose.yml
        docker image prune -f 2>/dev/null || true
        docker compose build --no-cache
        docker compose up -d --remove-orphans'

    - name: Health check
      run: |
        ssh -i ~/.ssh/id_rsa azureuser@${{ secrets.HOST_IP }} 'MAX=10; COUNT=0
        until curl -sf http://localhost:8000/health; do
          COUNT=$((COUNT+1))
          if [ $COUNT -ge $MAX ]; then
            cd /var/www/Pet-Sitter-Management-System-API
            PREV=$(git log --oneline -2 | tail -n1 | awk "{print \$1}")
            git reset --hard "$PREV"
            docker compose build --no-cache
            docker compose up -d --remove-orphans
            exit 1
          fi
          sleep 10
        done
        echo "API is healthy!"
        docker compose ps'
